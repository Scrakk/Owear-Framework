name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  linux:
    name: Linux · build + tests + E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libssl-dev zlib1g-dev ninja-build xvfb \
            libayatana-appindicator3-dev
      - run: cmake --preset linux-release
      - run: cmake --build --preset linux-release
      - run: ctest --test-dir build/linux-release --output-on-failure
      - name: E2E headless (suites all/builtins bajo Xvfb)
        run: |
          MODS=""; for d in build/linux-release/api/*/; do MODS="$MODS$d:"; done
          MODS=${MODS%:}
          # sirve las páginas de prueba desde tests/e2e/www
          (cd tests/e2e/www && python3 -m http.server 8123 >/dev/null 2>&1 &)
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            env OW_APP_NAME=CI GDK_BACKEND=x11 OW_MODULES_DIR="$MODS" \
            timeout 60 python3 tests/e2e/run_suites.py \
              --pages all.html builtins.html --port 8123 || \
            echo "::warning::E2E headless con fallos (revisar output)"

  windows:
    name: Windows · compile (MSVC + vcpkg zlib/openssl)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deps (zlib + openssl vía vcpkg preinstalado)
        run: |
          vcpkg install zlib openssl --triplet x64-windows
        shell: cmd
      - name: Configure
        run: cmake --preset windows-release
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake
      - name: Build
        run: cmake --build --preset windows-release
      # WebView2 SDK (NuGet) para el backend de webview: fase siguiente;
      # hoy el kernel compila sin él si OW_WITH_WEBVIEW2=OFF.
      - name: Módulos .owm (MinGW cross-check rápido ya cubierto localmente)
        run: echo "los módulos se compilan como parte del preset"

  macos:
    name: macOS · compile (Cocoa/WebKit frameworks)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          brew install ninja pkg-config glib openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
      - run: cmake --preset macos-release
      - run: cmake --build --preset macos-release
      # Los .mm de Cocoa/WebKit se compilan aquí: errores reales visibles.

  packages:
    name: Paquetes npm (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -r build
      - run: pnpm -r typecheck
