name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  linux:
    name: Linux · build + tests + E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libssl-dev zlib1g-dev ninja-build xvfb \
            libayatana-appindicator3-dev
      - run: cmake --preset linux-release
      - run: cmake --build --preset linux-release
      - run: ctest --test-dir build/linux-release --output-on-failure
      - name: E2E headless (suites all/builtins bajo Xvfb)
        run: |
          sudo apt-get install -y dbus dunst || true
          export $(dbus-launch)   # session bus para notification/power
          # dunst crashea puntual en runners (Trace/breakpoint trap):
          # reintentos con espera activa; si tras 3 intentos no vive, el
          # E2E sigue (notification/power reportarán fallo visible).
          for i in 1 2 3; do
            (dunst >/dev/null 2>&1 &)
            sleep 1
            pgrep -x dunst >/dev/null && break
          done
          MODS=""
          for d in build/linux-release/api/*/; do MODS="$MODS$d:"; done
          MODS=${MODS%:}
          (cd tests/e2e/www && python3 -m http.server 8123 >/dev/null 2>&1 &)
          sleep 0.5
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            env OW_APP_NAME=CI GDK_BACKEND=x11 OW_MODULES_DIR="$MODS" \
            setsid ./build/linux-release/src/owear > /tmp/owear-e2e.log 2>&1 &
          sleep 5
          timeout 150 python3 tests/e2e/run_suites.py \
            --pages all.html builtins.html --port 8123 || \
          { echo "::group::log del kernel"; cat /tmp/owear-e2e.log; echo "::endgroup::"; exit 1; }

  windows:
    name: Windows · compile + smoke (MSVC + vcpkg zlib/openssl)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Deps (zlib + openssl vía vcpkg preinstalado)
        run: vcpkg install zlib openssl --triplet x64-windows
        shell: cmd
      - name: Configure
        shell: cmd
        run: cmake --preset windows-release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
      - name: Build
        run: cmake --build --preset windows-release
      - name: Smoke test E2E (kernel + módulos + ventana WebView2 real)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = "build\windows-release\src\Release\owear.exe"
          if (!(Test-Path $exe)) { $exe = "build\windows-release\src\Debug\owear.exe" }
          Write-Host "exe=$exe"
          if (!(Test-Path "build\windows-release\src\Release\owear.exe") -and !(Test-Path "build\windows-release\src\Debug\owear.exe")) {
            Write-Error "owear.exe no existe"; exit 1
          }
          $mods = (Get-ChildItem "build\windows-release\api" -Directory | ForEach-Object {
              if (Test-Path "$($_.FullName)\Release") { "$($_.FullName)\Release" }
            }) -join ";"
          Write-Host "OW_MODULES_DIR=$mods"
          $env:OW_APP_NAME = "CI"
          $env:OW_MODULES_DIR = $mods
          $proc = Start-Process -FilePath $exe -PassThru -NoNewWindow `
                    -RedirectStandardError "owear-smoke.err.log" `
                    -RedirectStandardOutput "owear-smoke.out.log"
          try {
            python tests/smoke_windows.py $proc.Id
            if ($LASTEXITCODE -ne 0) { exit 1 }
            # suite E2E completa (mismas páginas que Linux): all + builtins
            python tests/e2e/run_suites.py --pages all.html builtins.html --port 8123
            if ($LASTEXITCODE -ne 0) { exit 1 }
            # salida limpia: app.quit por la pipe y WaitForExit
            python tests/quit_windows.py $proc.Id
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $proc.WaitForExit(20000) | Out-Null
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
              Write-Error "el kernel no salió tras app.quit"
              exit 1
            }
            Write-Host "smoke E2E OK: ventana WebView2 creada y salida limpia (exit $($proc.ExitCode))"
          } finally {
            Write-Host "::group::stderr del kernel"; Get-Content "owear-smoke.err.log" -ErrorAction SilentlyContinue; Write-Host "::endgroup::"
            Write-Host "::group::stdout del kernel"; Get-Content "owear-smoke.out.log" -ErrorAction SilentlyContinue; Write-Host "::endgroup::"
          }

  macos:
    name: macOS · compile + smoke (Cocoa/WebKit frameworks)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          brew install ninja pkg-config glib openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
      - name: Configure
        run: |
          cmake --preset macos-release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - run: cmake --build --preset macos-release
      - name: Smoke test (kernel vivo + carga de módulos .so)
        run: |
          MODS=""
          for d in build/macos-release/api/*/; do MODS="$MODS$d:"; done
          MODS=${MODS%:}
          echo "OW_MODULES_DIR=$MODS"
          OW_APP_NAME=CI OW_MODULES_DIR="$MODS" \
            ./build/macos-release/src/owear > /tmp/owear-smoke.log 2>&1 &
          KPID=$!
          sleep 8
          if ! kill -0 $KPID 2>/dev/null; then
            echo "::group::log del kernel"; cat /tmp/owear-smoke.log; echo "::endgroup::"
            echo "el kernel murió en el arranque"; exit 1
          fi
          kill $KPID
          echo "smoke OK: kernel vivo tras 8s"
      - name: E2E suite completa (all + builtins vía WKWebView)
        run: |
          MODS=""
          for d in build/macos-release/api/*/; do MODS="$MODS$d:"; done
          MODS=${MODS%:}
          OW_APP_NAME=CI OW_MODULES_DIR="$MODS" \
            ./build/macos-release/src/owear > /tmp/owear-e2e.log 2>&1 &
          KPID=$!
          sleep 8
          if ! kill -0 $KPID 2>/dev/null; then
            echo "::group::log del kernel"; cat /tmp/owear-e2e.log; echo "::endgroup::"
            echo "el kernel murió en el arranque"; exit 1
          fi
          RUNNER=""
          if command -v timeout >/dev/null 2>&1; then RUNNER="timeout 150";
          elif command -v gtimeout >/dev/null 2>&1; then RUNNER="gtimeout 150"; fi
          $RUNNER python3 tests/e2e/run_suites.py \
            --pages all.html builtins.html --port 8123 || \
          { echo "::group::log del kernel"; cat /tmp/owear-e2e.log; echo "::endgroup::";
            kill $KPID 2>/dev/null; exit 1; }
          kill $KPID 2>/dev/null
          echo "E2E macOS OK"
      # Los .mm de Cocoa/WebKit se compilan aquí: errores reales visibles.

  packages:
    name: Paquetes npm (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -r build
      - run: pnpm -r typecheck
